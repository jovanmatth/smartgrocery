<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  
  <!-- Subtle inner glow rim -->
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Shopping Trolley & Safety Shield Symbol -->
  <g filter="url(#shadow)" transform="translate(24, 24)">
    <!-- Cart Body -->
    <path d="M18 20h18l18 64a8 8 0 0 0 7.8 6h54.4a8 8 0 0 0 7.8-6.2l12-53.8H42" 
          fill="none" stroke="url(#cartGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cart Wheels -->
    <circle cx="68" cy="116" r="9" fill="#ffffff" />
    <circle cx="116" cy="116" r="9" fill="#ffffff" />
    
    <!-- Budget Shield / Safety Check in Basket -->
    <path d="M92 38 L92 56 L108 56" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="92" cy="46" r="22" fill="#0f172a" fill-opacity="0.75" />
    <path d="M83 46 l6 6 l14 -14" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
