<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cartGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />
  
  <!-- Subtle inner glow rim -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="5" />

  <!-- Shopping Trolley & Safety Shield Symbol -->
  <g filter="url(#shadow512)" transform="translate(64, 64)">
    <!-- Cart Handle & Wireframe -->
    <path d="M48 54 h48 l48 170 a22 22 0 0 0 21 16 h145 a22 22 0 0 0 21 -16.5 l32 -143.5 H112" 
          fill="none" stroke="url(#cartGrad512)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Wheels -->
    <circle cx="180" cy="310" r="24" fill="#ffffff" />
    <circle cx="310" cy="310" r="24" fill="#ffffff" />
    
    <!-- Floating Safety Budget Shield Badge -->
    <circle cx="245" cy="120" r="60" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-width="8" />
    <path d="M220 120 l20 20 l36 -36" fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
